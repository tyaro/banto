# Visual regression baseline regeneration (manual).
#
# `e2e/visual/**/*-snapshots/*.png` are committed pre-generated ON LINUX and
# ci.yml diffs against them directly. Playwright appends the platform to each
# snapshot filename, so `--update-snapshots` on a macOS/Windows workstation
# writes `-darwin`/`-win32` files ALONGSIDE the `-linux` baselines instead of
# replacing them (see e2e/visual/README.md) - a contributor without a Linux
# box therefore cannot regenerate baselines at all, and any intentional visual
# change leaves ci.yml red with no local way out.
#
# This workflow is that way out: dispatch it on the branch carrying the visual
# change and it regenerates the `-linux` baselines on the same ubuntu-latest
# image ci.yml uses.
#
# `commit` defaults to true: ONE dispatch regenerates, proves the baselines
# pass, and pushes them to the branch; review the change as the PNG diff on the
# PR. Pass `-f commit=false` to only upload the PNGs as an artifact (a trial
# run that writes nothing to the branch).
#
# Only the `visual` project runs (SNAPSHOT_SPECS in playwright.config.ts, now
# visual.spec.ts): it is the only spec that calls
# `toHaveScreenshot` (every baseline lives under
# visual.spec.ts-snapshots/), and only the `vite preview` server is started
# (BANTO_E2E_SERVERS=visual), so no Rust build is needed.
#
# Third-party actions are pinned to commit SHAs (see ci.yml's top-of-file
# policy comment); Dependabot (.github/dependabot.yml) keeps them current.
name: Visual baselines

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the regenerated baselines back to the dispatched branch'
        type: boolean
        default: true

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate -linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `visual` project's webServer is `vite preview`, which serves
      # apps/admin-template/build (e2e/visual/README.md).
      - name: Build frontend
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `=all`, not the default `changed` mode: `changed` only rewrites the
      # snapshots that FAILED, so any real change small enough to fit under
      # the tolerance (playwright.config.ts `maxDiffPixels: 250`;
      # it was `maxDiffPixelRatio` 0.001 of a fullPage screenshot's pixels
      # when the instance below was measured) leaves its baseline untouched and silently
      # stale - and the drift accumulates run after run until one day it
      # crosses the threshold as a mystery diff. Measured instance: the
      # 2026-09 header status chips changed dashboard/items/users visibly,
      # passed within tolerance, and left those baselines showing a header
      # that no longer existed. `=all` rewrites every baseline from the
      # current build, so what is committed always depicts the real UI.
      # `--project=visual` holds only the specs with `toHaveScreenshot` (SNAPSHOT_SPECS).
      # BANTO_E2E_SERVERS=visual starts just `vite preview`
      # (playwright.config.ts `selectWebServers`), not banto-serve.
      - name: Regenerate baselines
        env:
          BANTO_E2E_SERVERS: visual
        run: pnpm e2e:visual --update-snapshots=all

      # A regenerated baseline that does not then PASS a normal run would be a
      # broken baseline (non-deterministic rendering), so prove it here rather
      # than discovering it on the next PR.
      #
      # Only the `visual` project: the `visual-ui` specs take no
      # screenshots, so regenerated PNGs cannot affect them, and the PR's own
      # ci.yml run executes all of them anyway.
      - name: Verify regenerated baselines pass
        env:
          BANTO_E2E_SERVERS: visual
        run: pnpm e2e:visual

      - name: Summarize changed baselines
        run: |
          git add -A e2e/visual
          git status --short e2e/visual | tee "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: e2e/visual/**/*-snapshots/
          retention-days: 7

      - name: Commit baselines back to the branch
        if: inputs.commit
        run: |
          if git diff --cached --quiet -- e2e/visual; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(visual): regenerate -linux baselines'
          git push origin HEAD:"${GITHUB_REF_NAME}"
