# Template acceptance (AD-5 / maintainability-review-2026-07.md §7 追補).
#
# 第三者オンボーディングを機械で保証する: 「clone → rename → 動くアプリ」の
# 経路が壊れていないことを、テンプレートを実際にコピー・リネームしてから
# 型検査・cargo check まで通して確認する。ChatGPT/採用レビューが独立に指摘した
# 「最初の業務リソース追加から急に難しくなる」弱点の第一防波堤。
#
# 2段構え:
#   1) rename の統合テスト（`node --test scripts/rename.test.mjs`、軽量・毎回）。
#   2) end-to-end: リポジトリを一時ディレクトリへコピー→ `rename.mjs` 実行→
#      `pnpm install` / `pnpm check` / `cargo check`（コアクレート）。リネーム後の
#      テンプレートが型検査・ビルドを通ることを保証する。
#
# トリガは tauri-check.yml と同じ発想（毎PRは重いので回さない）:
#   - schedule（週次）で環境ドリフトを検出、
#   - scripts/ を触る PR / main push でリネーム変更を検出、
#   - workflow_dispatch で手動実行。
#
# サードパーティ Action は ci.yml のポリシーどおりコミット SHA 固定。
name: Template acceptance

on:
  schedule:
    # Weekly, Sunday 19:00 UTC = Monday 04:00 JST（tauri-check の1時間後）。
    - cron: '0 19 * * 0'
  # paths には scripts 本体に加えて **scaffold がアンカーを張る編集対象**も含める。
  # scripts だけをトリガにすると、アプリ側 PR がアンカー行を変えても本 WF が走らず
  # 破壊が週次スケジュールまで潜伏する（#122 と 8730373 で実際に2回再発。
  # maintenance-review-2026-08 H-2）。
  push:
    branches: [main]
    paths:
      - 'scripts/rename.mjs'
      - 'scripts/rename.test.mjs'
      - 'scripts/scaffold.test.mjs'
      - 'scripts/scaffold.mjs'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/lib/template-edit.mjs'
      # リソース生成器（#715）と、その受け入れ用フィクスチャ
      - 'scripts/banto.mjs'
      - 'scripts/lib/add-resource*'
      - 'scripts/fixtures/add-resource/**'
      # 生成器が番号と同名を検査し、生成した migration と一緒に走る（#715）
      - 'apps/admin-template/core/migrations-sqlite/**'
      - 'apps/admin-template/core/migrations-postgres/**'
      - 'scripts/lib/templates/**'
      - '.github/workflows/template-acceptance.yml'
      # scaffold のアンカー対象（remover が編集するファイル群）
      - 'apps/admin-template/src/routes/**'
      - 'apps/admin-template/src/lib/**'
      - 'apps/admin-template/src/app.css'
      - 'apps/admin-template/src/app.html'
      - 'apps/admin-template/messages/*.json'
      - 'apps/admin-template/package.json'
      - 'apps/admin-template/vite.config.ts'
      - 'eslint.config.js'
      - 'apps/admin-template/core/src/**'
      - 'apps/admin-template/core/Cargo.toml'
      - 'apps/admin-template/src-tauri/src/lib.rs'
      - 'apps/admin-template/src-tauri/src/tests.rs'
      - 'apps/admin-template/src-tauri/Cargo.toml'
      - 'apps/admin-template/src-tauri/tauri.conf.json'
      - 'apps/admin-template/src-tauri/tauri.fw-elev.conf.json'
      - 'apps/admin-template/src-tauri/windows/**'
      - 'apps/admin-template/elev/**'
      - 'packages/theme/**'
      - 'scripts/verify-architecture.mjs'
      - 'Cargo.toml'
      # display プリセットのアンカー対象（e2e / CI 定義も書き換える）
      - 'e2e/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'scripts/rename.mjs'
      - 'scripts/rename.test.mjs'
      - 'scripts/scaffold.test.mjs'
      - 'scripts/scaffold.mjs'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/lib/template-edit.mjs'
      # リソース生成器（#715）と、その受け入れ用フィクスチャ
      - 'scripts/banto.mjs'
      - 'scripts/lib/add-resource*'
      - 'scripts/fixtures/add-resource/**'
      # 生成器が番号と同名を検査し、生成した migration と一緒に走る（#715）
      - 'apps/admin-template/core/migrations-sqlite/**'
      - 'apps/admin-template/core/migrations-postgres/**'
      - 'scripts/lib/templates/**'
      - '.github/workflows/template-acceptance.yml'
      # scaffold のアンカー対象（push 側と同一に保つ）
      - 'apps/admin-template/src/routes/**'
      - 'apps/admin-template/src/lib/**'
      - 'apps/admin-template/src/app.css'
      - 'apps/admin-template/src/app.html'
      - 'apps/admin-template/messages/*.json'
      - 'apps/admin-template/package.json'
      - 'apps/admin-template/vite.config.ts'
      - 'eslint.config.js'
      - 'apps/admin-template/core/src/**'
      - 'apps/admin-template/core/Cargo.toml'
      - 'apps/admin-template/src-tauri/src/lib.rs'
      - 'apps/admin-template/src-tauri/src/tests.rs'
      - 'apps/admin-template/src-tauri/Cargo.toml'
      - 'apps/admin-template/src-tauri/tauri.conf.json'
      - 'apps/admin-template/src-tauri/tauri.fw-elev.conf.json'
      - 'apps/admin-template/src-tauri/windows/**'
      - 'apps/admin-template/elev/**'
      - 'packages/theme/**'
      - 'scripts/verify-architecture.mjs'
      - 'Cargo.toml'
      # display プリセットのアンカー対象（e2e / CI 定義も書き換える）
      - 'e2e/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: template-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Copy → rename → check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # 軽量ガード: rename/scaffold が約束どおりの書き換えを行い、--dry-run が無変更なこと。
      - name: rename / scaffold integration tests
        run: node --test scripts/rename.test.mjs scripts/scaffold.test.mjs

      # end-to-end: 実際にコピー＆リネームして、リネーム後のテンプレートが
      # 型検査・cargo check を通ることを確認する（第三者導線の証明）。
      # コピーは重い/生成物ディレクトリを除外する。
      - name: Copy repo to a scratch dir and rename
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/renamed"
          rsync -a \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'target' \
            --exclude '.svelte-kit' \
            --exclude 'build' \
            --exclude 'dist' \
            ./ "${DEST}/"
          cd "${DEST}"
          node scripts/rename.mjs \
            --name widget-admin \
            --title "Widget Admin" \
            --identifier com.example.widget \
            --repo https://github.com/example/widget-admin
          echo "DEST=${DEST}" >> "${GITHUB_ENV}"

      - name: Install deps in the renamed copy
        working-directory: ${{ env.DEST }}
        run: pnpm install --no-frozen-lockfile

      - name: Type-check the renamed copy
        working-directory: ${{ env.DEST }}
        run: pnpm check

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.DEST }}

      # コアクレート（Tauri 非依存）が renamed copy でも通ること。src-tauri は
      # tauri-check.yml の担当なのでここでは対象外。
      - name: Cargo check the renamed copy (core crates)
        working-directory: ${{ env.DEST }}
        run: cargo check -p banto-core -p banto-storage -p banto-server -p banto-attachments -p admin-template-core

      # ファイアウォールの helper（#219 段階 2、ADR-0021 決定 5）は identifier をビルド時の
      # 定数で持つ。リネームが tauri.conf.json と helper の両方を書き換えたことを、helper の
      # テスト（identifier_matches_tauri_conf ほか、名前・インストーラの設定の照合）で確かめる。
      - name: Test the fw-elev helper in the renamed copy
        working-directory: ${{ env.DEST }}
        run: cargo test -p admin-template-fw-elev

  # プリセット受け入れ（P4-9 / docs/design/scaffold-presets-plan.md §6）: 各プリセットで
  # `scaffold.mjs` を適用したクリーンコピーが「ビルド緑」であることを機械で保証する。
  # これは scaffold のハード要件 — 削除でツリーが壊れるプリセットを出荷しないための
  # 唯一の防波堤。上の rename と同じコピー/セットアップ様式を踏襲する。
  #
  # cargo test は presetによって banto-attachments を含む/含まないため、常に成立する
  # クレート集合（admin-template-core は banto-attachments を推移的に含むので full でも
  # 検査される）を明示指定する。src-tauri は display のみ `--no-run` でコンパイルを確かめる（実行は tauri-check.yml の担当）。
  #
  # `display`（docs/design/display-preset-plan.md、Issue #190）も同じ工程で検査する。
  # display は items デモ・users/audit-log 画面・ダッシュボードを外したうえで
  # `/monitor` と初回起動シードを**足す**唯一のプリセットなので、
  # 「引いた後もビルド緑」に加えて「足した後も型検査/テスト緑」がここで担保される。
  # e2e（display 用の1シナリオ・スモーク）はここでは走らせない — Playwright ブラウザの
  # 用意が要り、このジョブの目的（コピーが壊れていないこと）に対して重すぎるため。
  # ci.yml の e2e ジョブがテンプレート本体で同じ結線（閲覧公開 + 合成 viewer）を毎 PR で
  # 検証している。display だけ、生成物の banto-serve を新しい DB で起動し、初回の seed で
  # 公開閲覧が有効になることを curl で確かめる（ADR-0034 §10、下の step）。
  presets:
    name: Scaffold ${{ matrix.preset }} → check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, standard, full, display]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Copy repo to a scratch dir and scaffold the preset
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/preset-${{ matrix.preset }}"
          rsync -a \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'target' \
            --exclude '.svelte-kit' \
            --exclude 'build' \
            --exclude 'dist' \
            ./ "${DEST}/"
          cd "${DEST}"
          # --strict: pristine コピーでは全アンカーが必ず在るはずなので、
          # 「見つからない＝適用済み扱い」の無音スキップをアンカードリフトとして
          # 失敗にする（template-edit.mjs の strict 契約）。
          node scripts/scaffold.mjs --preset ${{ matrix.preset }} --strict
          echo "DEST=${DEST}" >> "${GITHUB_ENV}"

      - name: Install deps in the scaffolded copy
        working-directory: ${{ env.DEST }}
        run: pnpm install --no-frozen-lockfile

      # vitest はコピーの messages/*.json から生成した paraglide を読む（pretest で再生成）。
      # check・build も paraglide を作り直すので、その前に置いて「生成物が無い状態から
      # `pnpm test` だけで通る」ことを確かめる。scaffold が足した nav キー等が単体テスト
      # （navigation.test.ts ほか）で壊れていないことも保証する。
      - name: Unit-test the scaffolded copy
        working-directory: ${{ env.DEST }}
        run: pnpm --filter admin-template test

      - name: Architecture invariants still hold
        working-directory: ${{ env.DEST }}
        run: pnpm verify:architecture

      # scaffold が消したものを指す Markdown の相対リンクが残っていないこと。
      # コピーには .git が無い（rsync で除外）ので、git の追跡対象を作ってから検査する。
      - name: Doc links still resolve in the scaffolded copy
        working-directory: ${{ env.DEST }}
        run: |
          git init -q
          git add -A
          pnpm check:doc-links

      # scaffold が消したコードだけが使っていた import / 変数の消し残しを検出する
      # （--max-warnings=0 なので未使用警告も落ちる）。
      - name: Lint the scaffolded copy
        working-directory: ${{ env.DEST }}
        run: pnpm lint

      - name: Type-check the scaffolded copy
        working-directory: ${{ env.DEST }}
        run: pnpm --filter admin-template check

      # e2e/ の型検査（ルートの check:e2e）。scaffold が消したスイートや定数を、
      # 残った spec や playwright.config.ts が参照していれば落ちる。
      - name: Type-check the scaffolded e2e
        working-directory: ${{ env.DEST }}
        run: pnpm check:e2e

      - name: Build the scaffolded copy
        working-directory: ${{ env.DEST }}
        run: pnpm --filter admin-template build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.DEST }}

      # プリセットで banto-attachments が消える（minimal/standard）ため、常に成立する
      # クレート集合を指定（full は admin-template-core 経由で attachments も検査される）。
      # `cargo test`（`check` ではなく）で、削除後も各プリセットのテストが
      # コンパイル・パスすること＝「cargo test 緑」を機械で保証する。
      - name: Cargo test the scaffolded copy (core crates)
        working-directory: ${{ env.DEST }}
        run: cargo test -p banto-core -p banto-storage -p banto-server -p admin-template-core

      # ADR-0034 §10（C1 の受け入れ）: display の生成物を、新しい SQLite の DB で実際に起動する。
      # `BANTO_VIEWER_PUBLIC` は渡さない — 公開閲覧は、実 migration（0001〜0014）の後に走る
      # 初回の seed（`FIRST_BOOT_SETTINGS`）だけで有効になっていなければならない。
      # 見るもの: (1) ヘッダつきの `POST /api/auth/grant/publicViewer` が 200 でトークンを返し、
      # そのトークンで identity が読める、(2) DB の `settings` に seed の値と seed 済みの印がある、
      # (3) 止めて同じ DB でもう一度起動しても、変えた設定が seed で戻らない。
      # 単体試験（first_boot.rs）は「seed が書かれる」までで、起動したサーバーがそれを読んで
      # 公開閲覧を出すことはここでしか見ない。
      - name: Launch the display copy on a fresh database (first-boot seed → public viewing)
        if: matrix.preset == 'display'
        working-directory: ${{ env.DEST }}
        env:
          PORT: '18799'
          BANTO_BIND: 127.0.0.1
        run: |
          set -euo pipefail
          cargo build -p admin-template-core --bin banto-serve
          export BANTO_DB="$RUNNER_TEMP/display-first-boot.sqlite3"
          rm -f "$BANTO_DB"
          unset BANTO_VIEWER_PUBLIC
          base="http://127.0.0.1:$PORT"
          client='X-Banto-Client: banto'

          start() {
            ./target/debug/banto-serve > "$RUNNER_TEMP/display-serve.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 60); do
              if curl -s -o /dev/null -H "$client" "$base/api/auth/status"; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            echo "banto-serve did not start"; cat "$RUNNER_TEMP/display-serve.log"; return 1
          }
          stop() { kill "$pid"; wait "$pid" 2>/dev/null || true; }
          setting() { sqlite3 "$BANTO_DB" "SELECT value FROM settings WHERE key = '$1'"; }
          expect() { # expect <label> <actual> <expected>
            if [ "$2" != "$3" ]; then echo "NG $1: got '$2', want '$3'"; cat "$RUNNER_TEMP/display-serve.log"; exit 1; fi
            echo "ok $1 = $2"
          }

          start
          code=$(curl -s -o grant.json -w '%{http_code}' -X POST -H "$client" "$base/api/auth/grant/publicViewer")
          expect 'grant status' "$code" 200
          token=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('grant.json','utf8')).token ?? '')")
          test -n "$token"
          code=$(curl -s -o identity.json -w '%{http_code}' -H "$client" -H "Authorization: Bearer $token" "$base/api/auth/identity")
          expect 'identity status' "$code" 200
          cat identity.json; echo
          stop

          expect 'first_boot.seeded' "$(setting first_boot.seeded)" true
          expect 'server.viewer_public' "$(setting server.viewer_public)" true
          expect 'server.enabled' "$(setting server.enabled)" true
          expect 'server.bind' "$(setting server.bind)" 0.0.0.0
          expect 'auth.disabled' "$(setting auth.disabled)" true
          expect 'builtin admin rows' "$(sqlite3 "$BANTO_DB" "SELECT COUNT(*) FROM users WHERE kind = 'builtin' AND username = 'admin'")" 1
          expect 'accounts' "$(sqlite3 "$BANTO_DB" "SELECT COUNT(*) FROM users WHERE kind = 'account'")" 0

          # 2 回目の起動は seed し直さない（利用者が変えた設定を戻さない）。
          sqlite3 "$BANTO_DB" "UPDATE settings SET value = '127.0.0.1' WHERE key = 'server.bind'"
          start
          stop
          expect 'server.bind after the second start' "$(setting server.bind)" 127.0.0.1
          rm -f grant.json identity.json

      # display は items と attachments を両方外すので、src-tauri の lib.rs / tests.rs
      # から消した名前の消し残しは、アンカー一致だけでは見つからずコンパイルでだけ
      # 分かる（#820）。Tauri のシステム依存が要るので、コストを display に限る。
      - name: Install Tauri system dependencies (display)
        if: matrix.preset == 'display'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Compile the scaffolded copy's src-tauri tests (display)
        if: matrix.preset == 'display'
        working-directory: ${{ env.DEST }}
        run: cargo test -p admin-template --no-run

  # リソース生成の受け入れ（#715、docs/recipes/add-resource.md の生成器の節）:
  # `pnpm banto add resource` が吐いたコードが、素のテンプレートに足した状態でビルド緑
  # であることを機械で保証する。生成器の単体テスト（ci.yml）は出力の文字列を見るだけで、
  # 「足した後に型検査・cargo test が通る」までは見ない。アンカーが動いた・テンプレートが
  # 変わって生成物が合わなくなった、を PR の段階で止めるための検査。
  # 最後に Playwright で、生成した orders の一覧表示と 1 件の新規作成まで通す（e2e/tests-add-resource/）。
  # フィクスチャ（scripts/fixtures/add-resource/orders.json）は 5 つの型・必須/任意・
  # audit/title・min/max・記号入りのラベルを一通り含む。
  # clippy / fmt は回さない: 生成物は「この後は手で直す」足場で、lint の規則は ci.yml が
  # テンプレート本体に対して見ている。ここは「通る」ことに絞って時間を抑える。
  # scaffold の display プリセットの後に生成する組み合わせは未検査（今後の課題）。
  add-resource:
    name: Generate resource → check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Copy repo to a scratch dir and generate the fixture resource
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/add-resource"
          rsync -a \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'target' \
            --exclude '.svelte-kit' \
            --exclude 'build' \
            --exclude 'dist' \
            ./ "${DEST}/"
          cd "${DEST}"
          # 先に --dry-run: フィクスチャを生成器が受け付けることを確かめる（何も書かない）。
          node scripts/banto.mjs add resource orders --fields scripts/fixtures/add-resource/orders.json --dry-run
          node scripts/banto.mjs add resource orders --fields scripts/fixtures/add-resource/orders.json
          echo "DEST=${DEST}" >> "${GITHUB_ENV}"

      - name: Install deps in the generated copy
        working-directory: ${{ env.DEST }}
        run: pnpm install --no-frozen-lockfile

      - name: Architecture invariants still hold
        working-directory: ${{ env.DEST }}
        run: pnpm verify:architecture

      # check は Paraglide のコンパイルを先に走らせる。生成した messages の
      # orders.* / nav.orders が壊れていればここで落ちる。
      - name: Type-check the generated copy
        working-directory: ${{ env.DEST }}
        run: pnpm --filter admin-template check

      - name: Type-check the generated e2e
        working-directory: ${{ env.DEST }}
        run: pnpm check:e2e

      # src-tauri は生成物（コマンドの登録・テーブルの結線）が入る場所。tauri-check.yml と
      # 同じ system 依存を入れて、生成した Tauri コマンドのテスト（denied と監査、
      # conventions §1 の Tauri 側）まで走らせる。
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.DEST }}

      # SQLite のマイグレーションと生成した CRUD（core）を実際に走らせる。
      - name: Cargo test the generated copy (core crates)
        working-directory: ${{ env.DEST }}
        run: cargo test -p banto-core -p banto-storage -p banto-server -p admin-template-core

      - name: Cargo test the generated copy (src-tauri)
        working-directory: ${{ env.DEST }}
        run: cargo test -p admin-template

      # 生成直後に画面が実際に動くこと（#715 の終わりの条件）。orders の一覧・新規作成を
      # e2e/tests-add-resource/ の spec で確かめる。ci.yml の E2E ジョブと同じ手順:
      # 静的ビルドを banto-serve（embed-ui）に埋めて、Playwright がそのバイナリを直接起動する。
      - name: Build frontend of the generated copy
        working-directory: ${{ env.DEST }}
        run: pnpm build

      - name: Build banto-serve (embed-ui) of the generated copy
        working-directory: ${{ env.DEST }}
        run: cargo build -p admin-template-core --bin banto-serve --features embed-ui

      - name: Install Playwright Chromium
        working-directory: ${{ env.DEST }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E for the generated resource
        working-directory: ${{ env.DEST }}
        run: pnpm e2e:add-resource

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: add-resource-playwright-report
          path: |
            ${{ env.DEST }}/e2e/playwright-report/
            ${{ env.DEST }}/e2e/test-results/
          retention-days: 7
