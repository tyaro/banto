name: CI

# セキュリティ: サードパーティ Action はコミット SHA でピン留めする
# （タグは可変 = サプライチェーンリスク。improvement-plan P3-6）。
# 追従は Dependabot（.github/dependabot.yml）が担う。例外:
# dtolnay/rust-toolchain@stable は git ref がツールチェーンのチャンネル
# 選択を兼ねる仕様（@stable = Rust stable を追う）ため、SHA 固定すると
# ツールチェーンが凍結してしまう。意図的にタグ参照のまま残す。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Rust のデバッグ情報は行番号だけにする（CI 限定。ルートの Cargo.toml は
# 変えないので手元のデバッグには影響しない）。dev/test プロファイルは既定で
# 完全なデバッグ情報（Windows では PDB）を出し、そのリンクと rust-cache の
# 保存・復元が重い（計測: Windows の rust ジョブ約 7 分のうち Cargo test
# 202s・Post Setup Rust cache 40s）。panic のバックトレースの行番号は残る。
# test は dev を継承する。注意: Swatinem/rust-cache は `CARGO_` で始まる環境
# 変数をキャッシュのキーに含めるため、この追加のあと一度だけキャッシュが外れる。
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # 基準画像だけの作り直しの再実行で、重いジョブを飛ばすかを決める。
  # 流れ: PR の CI → visual-baselines.yml（commit: true、bot の push では CI が
  # 走らない）→ 人が push し直す → CI がもう一度走る。
  # 記録: 各 run は、実際に checkout した merge commit（refs/pull/N/merge）の親
  # （HEAD^1 = 検証した base、HEAD^2 = 検証した head）と full を artifact
  # `ci-verified-base` に残す。REST の pull_requests[].base.sha は使わない
  # （merge commit の base 親と一致する保証が無いため）。
  # 判定: head の祖先（first-parent、最大 10 個）を近い順に見て、ci.yml の run が
  # 成功（= 全ジョブ成功）し、その記録が full=true・記録した head がそのコミット・
  # 記録した base が今の HEAD^1 と一致するもっとも近いものを基準にする。基準からの
  # 差分が `e2e/visual/**/*-snapshots/*.png` だけなら full=false にし、
  # E2E (visual + axe-core) 以外を飛ばす。飛ばした run の記録は full=false なので
  # 次の基準にはならない（全部走って成功した run だけが基準）。
  # 安全側: pull_request 以外・fork・API / git / artifact の失敗・記録なし・
  # base の不一致（旧 base で成功 → main が進む → 基準画像だけ、を含む）・
  # それ以外のパスの差分は、どれも full=true。判定の理由はログに出す。
  # docs だけの差分: pull_request・fork でなく、merge commit の
  # `git diff HEAD^1 HEAD`（検証する base からの差分。過去の run の記録は要らない）が
  # すべて docs（^docs/、ルート直下の *.md、任意の場所の README*.md）なら、
  # docs=true・full=false（記録も false）にし、重いジョブを飛ばして frontend ジョブの
  # 軽い step（architecture / format / リンクの検査）だけを走らせる。この判定は基準画像の
  # 判定より前。reports/*.md（帳票の DSL、`?raw` で import される）は docs ではない。
  # 注意: Rust は matrix なので job ごと飛ばすとチェック名が必須チェック
  # 「Rust (…) (ubuntu-latest)」等と合わなくなる。そのため job は起動して
  # ステップだけ飛ばす。ほかのジョブは skipped（= 成功扱い）でよい。
  # dock-svelte の総当たりテスト（#798）: 出力 `dock` が `false` のときだけ、frontend ジョブの
  # Test step に `DOCK_EXHAUSTIVE` を渡さず、`packages/dock-svelte` のテストを浅い既定で走らせる
  # （`packages/dock-svelte/tests/fixtures/exhaustive.ts`）。pull_request・fork でなく、merge commit の
  # `git diff HEAD^1 HEAD` に `packages/dock-svelte/` が 1 つも無いときだけ false。push（main）・fork・
  # git の失敗は true（総当たりを全部走らせる）。判定の理由はログに出す。docs / full の判定とは独立。
  # 浅い既定で通した PR のあとの崩れは、週次の `.github/workflows/dock-exhaustive.yml`（全部の深さ、
  # 失敗したら追跡 Issue）が拾う。
  # touch-keys のブラウザーの fixture（#937 T2、touch-keypad-design §14.3）: 出力 `touch` が `false` のとき、
  # ジョブ `touch-keys-browser` を飛ばす。dock と同じ判定で、見るパスは fixture が読むもの
  # （`packages/touch-keys-svelte/`・`packages/ui/`（本物の Modal）・`packages/theme/`（CSS））と、
  # `pnpm-lock.yaml`・このワークフロー。push（main）・fork・git の失敗は true。
  # changes が失敗しても下流は `!cancelled()` で動き、出力が空なので全部走る
  # （`dock` が空 = `!= 'false'` なので総当たりも全部走る）。
  changes:
    name: Changes (visual baselines only?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      full: ${{ steps.decide.outputs.full }}
      docs: ${{ steps.decide.outputs.docs }}
      dock: ${{ steps.dock.outputs.dock }}
      touch: ${{ steps.touch.outputs.touch }}
    steps:
      # 既定の ref（pull_request では refs/pull/N/merge）= ほかのジョブが検証する
      # merge commit と同じものを取る。
      - name: Checkout merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 12
          persist-credentials: false

      # dock-svelte を触る差分か（上のコメントの「総当たりテスト」）。`dock=false` は、同じリポジトリの
      # pull_request で、merge commit の base からの差分に `packages/dock-svelte/` が無いときだけ。
      - name: Decide dock-svelte exhaustive tests
        id: dock
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          dock() { echo "dock: $2（$1）"; echo "dock=$2" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = pull_request ] || dock "pull_request 以外: $EVENT" true
          [ "$HEAD_REPO" = "$REPO" ] || dock "fork からの PR" true
          # 終了コードで判定する（`--name-only` はパス名を引用するので非 ASCII のパスは grep で外れる）。
          # 0 = 差分なし、1 = あり、それ以外 = エラー（安全側）。
          rc=0; git diff --quiet HEAD^1 HEAD -- packages/dock-svelte/ || rc=$?
          [ "$rc" -ne 1 ] || dock "dock-svelte を触る差分: 総当たりを全部走らせる" true
          [ "$rc" -eq 0 ] || dock "git diff に失敗（終了コード $rc）" true
          dock "dock-svelte を触らない差分: 総当たりは浅い既定" false

      # touch-keys のブラウザーの fixture を回すか（上のコメント）。
      - name: Decide touch-keys browser fixture
        id: touch
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          touch() { echo "touch: $2（$1）"; echo "touch=$2" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = pull_request ] || touch "pull_request 以外: $EVENT" true
          [ "$HEAD_REPO" = "$REPO" ] || touch "fork からの PR" true
          rc=0; git diff --quiet HEAD^1 HEAD -- packages/touch-keys-svelte/ packages/ui/ packages/theme/ pnpm-lock.yaml .github/workflows/ci.yml || rc=$?
          [ "$rc" -ne 1 ] || touch "fixture が読むパスを触る差分: 回す" true
          [ "$rc" -eq 0 ] || touch "git diff に失敗（終了コード $rc）" true
          touch "fixture が読むパスを触らない差分: 飛ばす" false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RECORD_DIR: ${{ runner.temp }}/ci-verified-base
        run: |
          mkdir -p "$RECORD_DIR"
          record() { # 検証した merge commit の親と full を残す（取れなければ残さない）
            [ -n "${VBASE:-}" ] && [ -n "${VHEAD:-}" ] || return 0
            printf 'base=%s\nhead=%s\nfull=%s\n' "$VBASE" "$VHEAD" "$1" > "$RECORD_DIR/record.txt"; echo "recorded=true" >> "$GITHUB_OUTPUT"
          }
          full() { echo "判定: 全部走らせる（$1）"; record true; echo "full=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = pull_request ] || full "pull_request 以外: $EVENT"
          VBASE=$(git rev-parse HEAD^1) && VHEAD=$(git rev-parse HEAD^2) || { VBASE=""; VHEAD=""; full "merge commit の親が取れない"; }
          echo "検証する merge commit: base=$VBASE head=$VHEAD"
          [ "$HEAD_REPO" = "$REPO" ] || full "fork からの PR"
          dfiles=$(git diff --no-renames --name-only HEAD^1 HEAD) || full "docs 判定の git diff に失敗"
          dother=$(printf '%s\n' "$dfiles" | grep -v -E '^$|^docs/|^[^/]+\.md$|(^|/)README(\.[A-Za-z-]+)?\.md$' || true)
          if [ -n "$dfiles" ] && [ -z "$dother" ]; then
            echo "差分のファイル（base からの全部）:"; echo "$dfiles"
            echo "判定: docs だけの差分。重いジョブを飛ばし、frontend ジョブの軽い step だけ走らせる"
            record false
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "docs 以外の差分あり: $(printf '%s' "$dother" | head -n 3 | tr '\n' ' ')"
          ancestors=$(git rev-list --first-parent --max-count=11 "$VHEAD" | tail -n +2) || full "git rev-list に失敗"
          ref=""
          for c in $ancestors; do
            ids=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$c&event=pull_request&status=success&per_page=20"               --jq '.workflow_runs[].id') || full "workflow run の取得に失敗"
            for id in $ids; do
              d="$RUNNER_TEMP/rec-$id"
              if ! gh run download "$id" -R "$REPO" -n ci-verified-base -D "$d" >/dev/null 2>&1; then
                echo "run $id（$c）: 記録なし"; continue
              fi
              rb=$(sed -n 's/^base=//p' "$d/record.txt"); rh=$(sed -n 's/^head=//p' "$d/record.txt"); rf=$(sed -n 's/^full=//p' "$d/record.txt")
              if [ "$rf" != true ]; then echo "run $id（$c）: 一部を飛ばした run なので基準にしない"; continue; fi
              if [ "$rh" != "$c" ]; then echo "run $id（$c）: 記録した head が $rh で不一致"; continue; fi
              if [ "$rb" != "$VBASE" ]; then echo "run $id（$c）: 検証した base が $rb で今の $VBASE と不一致"; continue; fi
              ref=$c; echo "基準: run $id（head $c、base $rb、全部成功）"; break 2
            done
          done
          [ -n "$ref" ] || full "直近 10 コミットに、同じ base を全部検証して成功した run の記録が無い"
          files=$(git diff --no-renames --name-only "$ref" "$VHEAD") || full "git diff に失敗"
          echo "差分のファイル:"; echo "${files:-（なし）}"
          other=$(printf '%s\n' "$files" | grep -v -E '^$|^e2e/visual/(.+/)?[^/]+-snapshots/[^/]+\.png$' || true)
          [ -z "$other" ] || full "基準画像以外の差分あり: $(printf '%s' "$other" | head -n 3 | tr '\n' ' ')"
          echo "判定: 基準画像だけの差分。E2E (visual + axe-core) 以外を飛ばす"
          record false
          echo "full=false" >> "$GITHUB_OUTPUT"

      - name: Upload verified base record
        if: always() && steps.decide.outputs.recorded == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-verified-base
          path: ${{ runner.temp }}/ci-verified-base/record.txt
          retention-days: 7

  frontend:
    name: Frontend (check / test / build)
    needs: changes
    # docs だけの差分（docs=true・full=false）でも走らせ、format / リンク / architecture
    # の軽い検査だけをここでする（必須チェックの名前を変えず、失敗をマージの条件に残す）。
    # 重い step は `if: needs.changes.outputs.docs != 'true'` で飛ばす。
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 = 履歴とタグも取る。verify:migrations が「HEAD から辿れる
      # 最新の v* タグ」と比べるため（既定の浅い clone ではタグが見えず、
      # スクリプトは素通りさせずに失敗する）。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Version is intentionally omitted: pnpm/action-setup resolves it from
      # the "packageManager" field in the root package.json (pnpm@10.33.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        if: needs.changes.outputs.docs != 'true'
        run: pnpm lint

      # docs/conventions.md のうち機械検査可能な不変条件（サービス層の
      # transport 非依存・パッケージ間 import ゼロ・{@html}/生色値の
      # 許可リスト等）を強制する（improvement-plan P3-5）。
      # 文字サイズ・枠線幅の生値の判定（rule raw-dimensions）と権限のガードの対称の判定
      # （rule 8 の (f)、Issue #697）は正規表現の見逃し・
      # 誤検知が起きやすいので、判定の関数のテストも同じ場所で回す。
      - name: Verify architecture invariants
        run: |
          node --test scripts/raw-dimensions.test.mjs scripts/permission-guards.test.mjs scripts/config-drafts-gates.test.mjs
          pnpm verify:architecture

      # リリース済み migration は追記のみ（#312 の P1 の再発防止）。SQLx は本文を
      # コメント込みで checksum して DB に記録するため、最新の v* タグに含まれる
      # migrations*/ のファイルが 1 バイトでも変わると、その版以前に作った DB が
      # VersionMismatch で起動しなくなる。スクリプト自身のテストも同じ場所で回す。
      - name: Verify released migrations are unchanged
        if: needs.changes.outputs.docs != 'true'
        run: |
          node --test scripts/verify-migrations-frozen.test.mjs
          pnpm verify:migrations

      # `pnpm banto add resource`（#715）: 名前とフィールド定義の検証、アンカーへの
      # 差し込み、アンカーが欠けたら何も書かずに止まること、scaffold の各プリセットの
      # 後でも全部のアンカーが残っていること。生成したコードのビルド（cargo test）は
      # ここでは見ない。
      - name: add-resource generator tests
        if: needs.changes.outputs.docs != 'true'
        run: node --test scripts/add-resource.test.mjs

      # マニフェスト間の version 一致を強制する（CR-7 通常CI。タグ名一致は
      # リリース/タグワークフローで `node scripts/check-versions.mjs --tag <name>`
      # として別途検査する）。ルート package.json は private=0.0.0 で例外。
      - name: Verify version consistency
        if: needs.changes.outputs.docs != 'true'
        run: pnpm check:versions

      # 日付・時刻の文字列の決まり（datetime-core.ts）は ui が原本で、forms・grid-svelte
      # は生成した写し（パッケージ間 import ゼロのため。Issue #811）。写しが原本と
      # 違えば落とす。スクリプト自身のテストも同じ場所で回す。
      - name: Verify datetime-core copies match the source
        if: needs.changes.outputs.docs != 'true'
        run: |
          node --test scripts/sync-datetime-core.test.mjs
          pnpm check:datetime-core

      - name: Format check (Prettier)
        run: pnpm format:check

      # Markdown の相対リンクの実在（docs だけの PR でも走る）。
      - name: Check doc links
        run: pnpm check:doc-links

      - name: Type check (svelte-check + tsc)
        if: needs.changes.outputs.docs != 'true'
        run: pnpm check

      - name: Test
        if: needs.changes.outputs.docs != 'true'
        # dock-svelte の総当たり（#798）: dock-svelte を触らない PR だけ浅い既定。changes の
        # 出力が空（失敗）・push（main）・fork は '1'（全部）。
        env:
          DOCK_EXHAUSTIVE: ${{ needs.changes.outputs.dock != 'false' && '1' || '' }}
        run: pnpm --recursive --if-present test

      - name: Build
        if: needs.changes.outputs.docs != 'true'
        run: pnpm build

  # i18n サプライチェーン/再現性ガード（テンプレート実用性レビュー §2）。
  # inlang プラグインは以前 jsdelivr の CDN URL で参照されており、毎ビルド
  # CDN 取得＝`--frozen-lockfile` の再現性の外だった。取得失敗時 paraglide-js は
  # WARN 後 exit 0 で空カタログを吐く（fail-open）ため、CI は常に緑・被害は
  # 閉域網の端末で発生していた。プラグインをローカル devDependency に移した
  # うえで、このジョブは「依存 install 後に CDN を遮断してから compile」して
  # (1) CDN に一切依存しないこと (2) fail-closed ガード
  # (scripts/check-i18n-nonempty.mjs) が非空カタログを保証すること、を検証する。
  i18n-offline:
    name: i18n (CDN-blocked reproducibility)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # jsdelivr（および一般的な npm ミラー CDN）をブラックホール化する。
      # ローカル参照が正しければ compile はこれで一切影響を受けない。もし
      # 何かが CDN 取得に退行したら 127.0.0.1 への接続が失敗し、空カタログ
      # → fail-closed ガードが非0終了してこのジョブが赤になる。
      - name: Block CDN egress (jsdelivr)
        run: |
          echo "127.0.0.1 cdn.jsdelivr.net" | sudo tee -a /etc/hosts
          echo "127.0.0.1 unpkg.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 esm.sh" | sudo tee -a /etc/hosts

      # ローカルプラグインから compile が成功し、ガードが非空カタログを
      # 通すことを確認する（CDN 遮断下でも緑になるのが正しい状態）。
      - name: Compile i18n from local plugins (offline)
        run: pnpm --filter admin-template paraglide:compile

  rust:
    name: Rust (fmt / clippy / check / test)
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: needs.changes.outputs.full != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        if: needs.changes.outputs.full != 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        if: needs.changes.outputs.full != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # rustfmt only parses/reformats - no compilation, so unlike the steps
      # below it can safely cover every workspace member (including
      # `admin-template`/src-tauri) without needing its native system deps.
      - name: Format check (rustfmt)
        if: needs.changes.outputs.full != 'false'
        run: cargo fmt --all -- --check

      # Scope: only the Tauri-independent crates are checked/linted/tested
      # here. `admin-template` (apps/admin-template/src-tauri) pulls in
      # WebView2 on Windows and webkit2gtk/libsoup/etc. on Linux, which
      # requires heavy system dependency installation. It is intentionally
      # excluded from this v1 CI to keep the pipeline fast and
      # dependency-free; it can be added back later with the appropriate
      # `tauri-apps/tauri-action` / apt setup once native builds are needed
      # in CI.
      # (clippy for it runs in tauri-check.yml, which has the system deps.)
      - name: Cargo check
        if: needs.changes.outputs.full != 'false'
        run: cargo check -p banto-core -p banto-storage -p banto-admin-services -p banto-server -p banto-attachments -p admin-template-core -p admin-template-fw-elev

      - name: Clippy
        if: needs.changes.outputs.full != 'false'
        run: cargo clippy -p banto-core -p banto-storage -p banto-admin-services -p banto-server -p banto-attachments -p admin-template-core -p admin-template-fw-elev --all-targets -- -D warnings

      - name: Cargo test
        if: needs.changes.outputs.full != 'false'
        run: cargo test -p banto-core -p banto-storage -p banto-admin-services -p banto-server -p banto-attachments -p admin-template-core -p admin-template-fw-elev

  # banto-storage の PostgreSQL 接続ヘルパ（feature `postgres`）向け統合テスト。
  # 上の `rust` ジョブは default feature（sqlite のみ）でビルドしているため
  # ここに切り出す。実 PostgreSQL への接続が要る唯一のテスト
  # (postgres::tests::connect_gives_a_usable_pool) は BANTO_TEST_PG_URL が
  # 未設定だと早期 return で skip する仕様（ローカル `cargo test` は
  # PostgreSQL 無しで通る）ので、CI 側でこの env を設定して実接続を検証する。
  storage-postgres:
    name: banto-storage (PostgreSQL integration)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banto_storage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # `--no-default-features --features postgres`: banto-storage の default
      # feature は sqlite なので、postgres feature 単独でもビルドできる
      # ことをここで確認する（sqlite feature を混ぜても良いが、Postgres
      # 専用ビルドが成立することの検証を優先）。
      - name: Cargo test (banto-storage, postgres feature)
        env:
          BANTO_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/banto_storage_test
        run: cargo test -p banto-storage --no-default-features --features postgres

  # app 層（admin-template-core）を feature `postgres` でビルドし、実
  # `postgres:16` に対して migrations-postgres 適用 + 決定的シード + 主要
  # CRUD（items/users/settings/audit の代表操作）が通ることを検証する
  # (V2 "PostgreSQL アプリ全体対応", PR3)。上の `storage-postgres` が接続
  # ヘルパ単体を見るのに対し、こちらはサービス層の Postgres アームを
  # 実際に exercise する初めてのジョブ。スモークの本体は統合テスト
  # `tests/pg_smoke.rs`（`BANTO_TEST_PG_URL` 未設定なら早期 return で skip、
  # ローカルの PostgreSQL 無し環境では通る仕様）。
  app-postgres:
    name: admin-template-core (PostgreSQL smoke)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banto_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # `--features postgres` keeps the default `sqlite` on too (the app crate
      # always links SQLite for the desktop path), so this exercises the
      # both-backends build that `init_db_from_target` selects at runtime.
      # `pg_attachments` (Issue #208) creates and drops its own databases/role
      # on the same server (the `postgres` superuser has CREATEDB/CREATEROLE)
      # to check that attachments stay per-database and survive a password
      # change.
      - name: Cargo test (admin-template-core, postgres smoke)
        env:
          BANTO_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/banto_app_test
        run: cargo test -p admin-template-core --features postgres --test pg_smoke --test pg_attachments

      # ADR-0019（tyaro/banto-industrial#437）: DB に書けない監査の保留ファイル。
      # 失敗（表の改名）と応答なし（別トランザクションの排他ロック）の両方で、
      # 保留 → 流し込みが 1 行だけになること。専用スキーマを作るので public には触れない。
      - name: Cargo test (banto-admin-services, postgres audit spool)
        env:
          BANTO_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/banto_app_test
        run: cargo test -p banto-admin-services --features postgres pg_audit_spool

      # #938（config-draft-publish-design §6 の T11）: 設定の下書き・反映・元に戻す。
      # SQLite と同じ本文（`config_drafts/cases.rs`）を、別々のプール 2 つで通す:
      # 版の衝突と取り直し・古い revision・ロック・反映が 1 つのまとまりであること・
      # 元に戻す・状態と差分が同じスナップショットであること・2 接続の同時反映。
      # 試験ごとに専用スキーマを作るので public には触れない。
      - name: Cargo test (banto-admin-services, postgres config drafts)
        env:
          BANTO_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/banto_app_test
        run: cargo test -p banto-admin-services --features postgres pg_config_drafts

  e2e:
    name: E2E (Playwright smoke)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Produces apps/admin-template/build - the static SvelteKit output
      # `--features embed-ui` (below) embeds into the server binary
      # (apps/admin-template/core/src/assets.rs).
      - name: Build frontend
        run: pnpm build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # e2e/playwright.config.ts's webServer launches this binary directly
      # (not `cargo run`) - it must already exist before `pnpm e2e` below.
      - name: Build banto-serve (embed-ui)
        run: cargo build -p admin-template-core --bin banto-serve --features embed-ui

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # chromium project が使うのは :8799 の banto-serve だけ（2 本目は立てない）。
      - name: Run E2E smoke suite
        env:
          BANTO_E2E_SERVERS: smoke
        run: pnpm e2e

      # Viewer-public mode (Issue #189): second banto-serve started with
      # BANTO_VIEWER_PUBLIC=1 by the same playwright config (no account, no
      # login), and a third one with an administrator from `create-admin`
      # (login required) for the scenarios that log in next to public viewing.
      - name: Run E2E viewer-public suites
        env:
          BANTO_E2E_SERVERS: public-viewer,public-viewer-login
        run: pnpm e2e:public-viewer

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      # Diff/actual/expected images for failed toHaveScreenshot() comparisons
      # land here (not in playwright-report/), so surface them separately -
      # short retention since this is only useful for the PR that produced it.
      - name: Upload Playwright test results (diffs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 3

  # @banto/touch-keys-svelte のブラウザーの fixture（#937 T2、touch-keypad-design §14.3）。
  # パッケージの中の最小の画面（tests/browser/。テンプレートには配線しない）を vite で出し、
  # Playwright のタッチの文脈で、当たり判定・top layer・フォーカス・ブラウザーの数値の検証・
  # 本物の @banto/ui の Modal との組み合わせを確かめる（jsdom では確かめられない約束）。
  # アプリのビルドも Rust も要らない。fixture が読むパスを触らない PR では飛ばす（changes の `touch`）。
  touch-keys-browser:
    name: touch-keys (browser fixture)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' && needs.changes.outputs.touch != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run touch-keys browser fixture
        run: pnpm e2e:touch-keys

      - name: Upload Playwright test results (traces)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: touch-keys-browser-test-results
          path: packages/touch-keys-svelte/tests/browser/test-results/
          retention-days: 3

  e2e-visual:
    name: E2E (visual + axe-core)
    needs: changes
    # 基準画像だけの差分でも走らせる（full ではなく docs だけで判断する）。
    if: ${{ !cancelled() && needs.changes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Produces apps/admin-template/build, which `vite preview` serves.
      - name: Build frontend
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Baselines under e2e/visual/**/*-snapshots are committed pre-generated
      # on Linux, so this ubuntu-latest runner diffs against them directly -
      # no --update-snapshots step needed here. Only the `vite preview`
      # webServer is needed (BANTO_E2E_SERVERS=visual, playwright.config.ts),
      # so this job builds no Rust and runs parallel to `e2e`.
      - name: Run visual regression suite (screenshots)
        id: visual
        env:
          BANTO_E2E_SERVERS: visual
        run: pnpm e2e:visual

      # The rest of e2e/visual (no screenshots) runs in parallel (Issue #798).
      # Same `vite preview` server; `visual` (above) = SNAPSHOT_SPECS only.
      # `!cancelled()`: a red screenshot diff must not hide the functional / axe result
      # (they used to come from one run). Skipped only when setup failed before `visual`.
      - name: Run visual UI + axe-core suite (parallel)
        if: ${{ !cancelled() && steps.visual.conclusion != 'skipped' }}
        env:
          BANTO_E2E_SERVERS: visual
          BANTO_E2E_REPORT_DIR: playwright-report-ui
        run: pnpm e2e:visual-ui

      # Demo-build-only UI (Issue #553): `vite dev` with VITE_BANTO_DEMO=1.
      - name: Run demo-build suite
        if: ${{ !cancelled() && steps.visual.conclusion != 'skipped' }}
        env:
          BANTO_E2E_SERVERS: demo
          BANTO_E2E_REPORT_DIR: playwright-report-demo
        run: pnpm e2e:demo

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-visual
          path: |
            e2e/playwright-report/
            e2e/playwright-report-ui/
            e2e/playwright-report-demo/
          retention-days: 7

      # Diff/actual/expected images for failed toHaveScreenshot() comparisons
      # land here (not in playwright-report/), so surface them separately -
      # short retention since this is only useful for the PR that produced it.
      - name: Upload Playwright test results (diffs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-visual
          path: |
            e2e/test-results/
            e2e/test-results-ui/
            e2e/test-results-demo/
          retention-days: 3

  audit:
    name: Dependency audit (pnpm audit / cargo audit)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--prod`: this is a template repo, and devDependencies (build
      # tooling, linters, Playwright, ...) are never shipped to end users
      # and turn over far more often than runtime deps. Gating CI on their
      # advisories would turn every template user's CI red on every new
      # devDependency-only advisory, with nothing actionable for them to
      # do about a package that never reaches production. Scoping to
      # `--prod` keeps this job meaningful: it only fails for advisories in
      # code that actually ships in the built frontend.
      - name: pnpm audit (prod dependencies only)
        run: pnpm audit --prod --audit-level high

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Matches this workflow's existing convention (see the `rust` job)
      # of using dtolnay for the toolchain itself; taiki-e/install-action
      # is used here specifically because it installs prebuilt `cargo-audit`
      # binaries instead of compiling from source, which would otherwise
      # add several minutes to this job.
      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit
