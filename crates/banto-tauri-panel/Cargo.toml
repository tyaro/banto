[package]
name = "banto-tauri-panel"
description = "Banto: pop-out panel windows for Tauri v2 (open / focus, closed notice, per-id window geometry memory, close with the main window). ADR-0037"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Required by `tauri-plugin`'s build step (it hands the generated permission
# files to the app's `tauri-build` through `DEP_<links>_...`). The plugin name
# the ACL sees is derived from this value, so it must stay equal to
# `PLUGIN_NAME` in `src/plugin.rs`.
links = "banto-tauri-panel"

[features]
# ADR-0037: the Tauri wiring (the plugin itself) is on by default - an app
# just depends on the crate. The pure half (ids, routes, window geometry and
# its JSON store) builds and tests WITHOUT it, which is what CI's headless
# containers run (`cargo test -p banto-tauri-panel --no-default-features`;
# they cannot build anything that links tauri - same reason as the workspace
# Cargo.toml's `keyring` note).
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-plugin"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# `default-features = false`: the app's own `tauri` dependency picks the
# runtime (wry) and the rest; this crate only names the API.
tauri = { version = "2", default-features = false, optional = true }

[build-dependencies]
# Generates `permissions/autogenerated/` (allow-open / deny-open) and the ACL
# manifest the app's `tauri-build` reads. Optional so the headless build
# compiles no Tauri crate.
tauri-plugin = { version = "2", features = ["build"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
