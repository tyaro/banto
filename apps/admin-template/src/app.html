<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- PWA installable-only (M-review 2026-08 §2.8): a web manifest + icons
		     so the LAN-browser build can be "Add to Home Screen"/installed. No
		     service worker (no offline scope). `%sveltekit.assets%` keeps the
		     manifest URL correct under BASE_PATH (Pages demo); the manifest's
		     own paths are relative, so it needs no base awareness. NOTE: browsers
		     only offer install over a secure context — the embedded LAN server is
		     plain HTTP by design (ADR-0003, TLS via reverse proxy), so install is
		     available on HTTPS / localhost / behind a TLS proxy, inert on plain
		     HTTP LAN. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<!-- = --banto-primary at the default --banto-brand-hue (258) in sRGB. Static:
		     change it by hand together with the hue (#557). -->
		<meta name="theme-color" content="#145ec1" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Banto" />
		<!-- axe-core wcag2a document-title (visual-refresh-plan.md §7.1): a
		     static fallback so every route has a non-empty <title> even
		     without its own <svelte:head> override (only routes/panel/[id]
		     sets a dynamic one, spec §5.3's pop-out windows). -->
		<title>Banto</title>
		<!-- The locales of project.inlang (and the one a visitor with nothing usable
		     stored gets), as JSON, filled in by src/hooks.server.ts from Paraglide
		     so a locale added to the dictionary needs no edit here (Issue #1024).
		     The first script below reads it. -->
		<meta name="banto-locales" content="%banto.locales%" />
		<script>
			// Apply the persisted theme + preset + locale before first paint to avoid a
			// flash. Storage keys must match src/lib/settings.svelte.ts and
			// src/lib/banto/locale.ts. Locale defaults to 'ja' (the effective
			// default display locale; base/source locale is 'en') so a fresh tab
			// renders exactly as before (ADR-0005). The accepted locales and that
			// default come from the <meta name="banto-locales"> above, not from a
			// list written here.
			(function () {
				var fallback = 'ja';
				var known = ['ja'];
				try {
					var carried = JSON.parse(document.querySelector('meta[name="banto-locales"]').content);
					fallback = carried.fallback;
					known = carried.locales;
				} catch (_) {}
				try {
					var mode = localStorage.getItem('banto.theme') || 'system';
					var dark =
						mode === 'dark' ||
						(mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
					var preset = localStorage.getItem('banto.preset');
					document.documentElement.dataset.bantoPreset = preset === 'glass' ? 'glass' : 'standard';
					var density = localStorage.getItem('banto.density');
					document.documentElement.dataset.bantoDensity =
						density === 'compact' || density === 'touch' ? density : 'standard';
					var locale = localStorage.getItem('banto.locale');
					document.documentElement.lang = known.indexOf(locale) >= 0 ? locale : fallback;
				} catch (_) {
					document.documentElement.dataset.theme = 'light';
					document.documentElement.dataset.bantoPreset = 'standard';
					document.documentElement.dataset.bantoDensity = 'standard';
					document.documentElement.lang = fallback;
				}
			})();
		</script>
		<!-- The page's own background until the theme CSS arrives (Issue #1015). That
		     CSS is loaded by the app's script, so without this the webview shows
		     its default white for the first moments of a window - the pop-out
		     panel window above all, in the dark theme. `:where()` has no
		     specificity, so the theme's `html { background: var(--banto-bg) }`
		     replaces it the moment it exists. Raw values on purpose (no token
		     exists yet): the same colours as `--banto-neutral-2` (light) and
		     `--banto-neutral-1` (dark) in packages/theme/src/css/banto.css at the
		     default --banto-brand-hue (258); change them together with that hue. -->
		<style>
			:where(html) {
				background: oklch(0.977 0.004 258);
			}
			:where(html[data-theme='dark']) {
				background: oklch(0.2 0.009 258);
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- role="presentation" (#1024): Svelte puts its delegated listeners (click, ...) on
		     this element, and Chromium exposes an element with a click listener as
		     "clickable" - a screen reader then said "clickable" before the first landmark
		     of every page. The wrapper means nothing by itself, so it stays out of the
		     accessibility tree. -->
		<div style="display: contents" role="presentation">%sveltekit.body%</div>
		<!-- Static content from parse time (Issue #1024): before Svelte draws, the
		     document has no children and a screen reader (NVDA) building its virtual
		     buffer then reads the document URL. Visually hidden; removed by
		     routes/+layout.svelte once the app is drawn. The wording is not written
		     here: src/hooks.server.ts fills the placeholder below with the dictionary's
		     `common.loading` of every locale (JSON keyed by locale, conventions §13)
		     when it renders this shell (build and `vite dev`), and the script below
		     picks the one for the `lang` the first script in <head> decided. -->
		<p
			id="banto-boot-status"
			data-messages="%banto.bootStatus%"
			style="
				position: absolute;
				width: 1px;
				height: 1px;
				margin: -1px;
				padding: 0;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
				border: 0;
			"
		></p>
		<script>
			(function () {
				var status = document.getElementById('banto-boot-status');
				try {
					var messages = JSON.parse(status.dataset.messages);
					status.textContent = messages[document.documentElement.lang] || '';
				} catch (_) {
					// Leave it empty: wording is never written here.
				}
			})();
		</script>
	</body>
</html>
