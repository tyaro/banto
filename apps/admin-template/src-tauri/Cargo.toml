[package]
name = "admin-template"
description = "Banto admin template Tauri app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "admin_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["system-metrics"]
# CPU/memory metrics (ADR-0013, Issue #185): passthrough to
# `admin-template-core`'s own feature of the same name, ON by default here
# for the same "template is the wiring sample" reason as that crate's
# Cargo.toml comment. To remove `sysinfo` from a derived app, drop this
# feature from `default` here AND in `apps/admin-template/core/Cargo.toml`
# (docs/recipes/remove-optional-assets.md「システムメトリクス（`sysinfo`）を外す」).
system-metrics = ["admin-template-core/system-metrics"]
# Passthrough to admin-template-core's own `embed-ui` feature (spec §11.1).
# OFF by default so a fresh clone's `cargo build`/`tauri dev` never requires
# `pnpm --filter admin-template build` to have already run - without it, the
# embedded server (when LAN access is enabled) serves the small built-in
# placeholder page instead of the real SvelteKit build. Build with
# `tauri build --features embed-ui` (or `cargo build -p admin-template
# --features embed-ui`) AFTER `pnpm --filter admin-template build` to embed
# the real frontend so LAN clients get the actual UI, not the placeholder.
embed-ui = ["admin-template-core/embed-ui"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
banto-core = { path = "../../../crates/banto-core" }
banto-server = { workspace = true }
# M20 attachments (spec docs/design/attachments-plan.md §3.1, unit B): `AppState`
# holds an `AttachmentsService` directly, same as `admin-template-core`'s
# `rest.rs`.
banto-attachments = { workspace = true }
admin-template-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
# Only for naming `tokio::sync::broadcast::Sender<ServerEvent>` /
# `tokio::sync::Mutex<Option<RunningServer>>` as AppState field types (spec
# §3.5, §11.4) - tokio is already pulled in transitively via `tauri` and
# `admin-template-core`; this just makes a couple of its types nameable in
# this crate's own source. `rt` (ADR-0013, Issue #185): the `system_info`
# command calls `tokio::task::spawn_blocking` to run the (synchronous,
# blocking) CPU/memory sampler off the async command's own thread, symmetric
# with `banto_server::routes::system_info`'s handler - already pulled in
# transitively via `tauri`'s own tokio runtime, named explicitly for the same
# "do not silently depend on another dependency's feature choices" reason.
tokio = { workspace = true, features = ["sync", "rt"] }
qrcode = { workspace = true }
futures-util = { workspace = true }
# OS keyring storage for the auto-login credential (spec M11). See the
# workspace `Cargo.toml`'s comment on this dependency for why it lives only
# here and not on `admin-template-core`.
keyring = { workspace = true }
# Issue #219 stage 2 (ADR-0021 decisions 7 and 8): the firewall helper's
# lib only - its placement judgement (`placement::check_placement`) and the
# Windows fact collection, so the check before asking for elevation is the
# helper's own rule (same function, same tests). Depending on the lib builds
# neither the helper's bin nor its manifest into this exe (its build.rs
# links the manifest into that `[[bin]]` only).
admin-template-fw-elev = { path = "../elev" }

# `#[tokio::test]` for this crate's own unit tests (spec M14: the
# `change_own_password` audit-recording test) - the runtime/macros features
# are test-only so the production dependency above stays "sync"-only.
[dev-dependencies]
# `net`/`io-util` (Issue #204): the cross-process session tests drive a real
# embedded-server port with plain HTTP/1.1 over `tokio::net::TcpStream`
# instead of adding an HTTP client crate. Both are already compiled into the
# graph through `banto-server`; named here so the tests do not silently
# depend on another crate's feature choices.
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
# Spec M17 backup tests: `BackupService::create`'s `VACUUM INTO` needs a
# real on-disk pool (see `admin-template-core::backup`'s test module doc
# comment for why `:memory:` does not work), so these tests cannot reuse
# `app_state()`'s in-memory `init_db_memory()` - see `app_state_with_tempdir`.
tempfile = { workspace = true }
# Issue #285 attachments test: injects a `has_thumbnail` UPDATE failure with a
# SQLite trigger. Already in the graph via `admin-template-core`.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }

# Real window translucency for the glass theme (spec M12): Windows Acrylic
# via `window_vibrancy::apply_acrylic`/`clear_acrylic`. Windows-only by
# decision (docs/roadmap.md §6: macOS vibrancy は非スコープ), hence a
# target-specific dependency table rather than a crate feature - non-Windows
# builds never even compile the crate, and the `vibrancy_*` commands in
# `src/lib.rs` `#[cfg]`-degrade to "not supported" there.
[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = { workspace = true }

# A table of its own (not under window-vibrancy's above), so removing the
# glass theme's dependency (scaffold / remove-optional-assets) leaves it.
[target.'cfg(windows)'.dependencies]
# ADR-0021 decisions 7 and 14 (conventions §3 "足す側の例外"): the runas
# launch module (`src/elevated_launch.rs`) only, at the version already in
# Cargo.lock (0.61.2), so no new crate enters the build. Features, by use:
# - Win32_Foundation: CloseHandle / GetLastError / WAIT_OBJECT_0
# - Win32_System_Registry: needed by SHELLEXECUTEINFOW (its `hkeyClass`)
# - Win32_System_Threading: WaitForSingleObject / GetExitCodeProcess
# - Win32_UI_Shell: ShellExecuteExW / SEE_MASK_NOCLOSEPROCESS
# - Win32_UI_WindowsAndMessaging: SW_SHOWNORMAL
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
